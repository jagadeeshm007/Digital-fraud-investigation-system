name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dfis
          POSTGRES_PASSWORD: dfis_ci
          POSTGRES_DB: dfis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dfis -d dfis_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dfis:dfis_ci@localhost:5432/dfis_test
      FAKE_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Generate a throwaway masking key for this run
        run: echo "MASKING_HMAC_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Install
        run: pip install -r requirements.txt ruff pytest pytest-cov pytest-asyncio httpx
      - name: Ruff lint
        run: ruff check app/
      - name: pytest
        run: |
          if [ -d tests ]; then
            pytest --cov=app --cov-report=term-missing --cov-fail-under=80
          else
            echo "No tests/ directory yet; skipping pytest."
          fi

  frontend:
    name: Frontend (Vite+ fmt, lint, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Format check
        run: npx vp fmt --check
      - name: Lint
        run: npx vp lint
      - name: Vitest
        run: npm test
      - name: Type check and build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dfis:ci .
